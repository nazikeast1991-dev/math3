<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>Фигуралар салу</title>
<style>
:root{
  --bg:#fff4e6; --card:#ffffff; --ink:#3b2a1a; --muted:#7a6552;
  --main:#ff7a45; --main2:#ffb347; --sel:#4a7cff; --selbg:#eaf0ff;
  --A:#2e9e5b; --Abg:#e3f6ea; --B:#e08a00; --Bbg:#fff1d6; --C:#8a4fd8; --Cbg:#f1e8ff;
  --ok:#2e9e5b; --okbg:#e3f6ea; --bad:#e0504a; --badbg:#fde8e7; --line:#f0dcc6;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:linear-gradient(180deg,#ffe8cc 0%,var(--bg) 40%);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
  font-size:18px;line-height:1.45;min-height:100vh;overflow-x:hidden;
  font-variant-numeric:tabular-nums lining-nums}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:14px 14px 28px}
.hidden{display:none!important}
.card{background:var(--card);border-radius:20px;padding:18px 16px;box-shadow:0 6px 18px rgba(160,90,20,.12);margin-bottom:14px}
.hero{text-align:center;padding:22px 16px}
.hero .emoji{font-size:44px;line-height:1}
.sub{color:var(--muted);font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-top:8px}
h1{font-size:25px;line-height:1.25;margin-top:6px;color:#c4471b;word-wrap:break-word}
h2{font-size:18px;margin-bottom:8px}
.goals li{list-style:none;background:#fff8ef;border-left:5px solid var(--main2);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:16px}
.goals b{white-space:nowrap}
.levels{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
label.lbl{display:block;font-weight:700;margin-bottom:6px}
input[type=text]{width:100%;font-size:20px;padding:13px 14px;border:3px solid var(--line);border-radius:14px;outline:none;background:#fffdf9;color:var(--ink)}
input[type=text]:focus{border-color:var(--main)}
.err{color:var(--bad);font-size:15px;margin-top:6px;min-height:20px;font-weight:600}
.btn{display:block;width:100%;border:none;border-radius:16px;padding:15px 16px;font-size:20px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,var(--main),var(--main2));box-shadow:0 4px 0 #d9622e}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #d9622e}
.btn[disabled]{background:#d9cfc4;box-shadow:0 4px 0 #bfb3a6;color:#fff;cursor:not-allowed}
.btn.green{background:linear-gradient(135deg,#2e9e5b,#5ac47f);box-shadow:0 4px 0 #237a46}
.btn.green[disabled]{background:#d9cfc4;box-shadow:0 4px 0 #bfb3a6}
.badge{display:inline-block;font-size:14px;font-weight:800;padding:5px 11px;border-radius:999px;white-space:nowrap}
.bA{background:var(--Abg);color:var(--A);border:2px solid var(--A)}
.bB{background:var(--Bbg);color:var(--B);border:2px solid var(--B)}
.bC{background:var(--Cbg);color:var(--C);border:2px solid var(--C)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.counter{font-weight:800;font-size:20px;white-space:nowrap}
.pbar{height:10px;background:#f3e3d0;border-radius:99px;overflow:hidden;margin-bottom:12px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--main),var(--main2));width:0;transition:width .25s}
.qcard.lA{border-top:7px solid var(--A)} .qcard.lB{border-top:7px solid var(--B)} .qcard.lC{border-top:7px solid var(--C)}
.qtext{font-size:21px;font-weight:700;line-height:1.5;margin-bottom:12px;word-wrap:break-word}
.fig{display:flex;flex-direction:column;align-items:center;gap:10px;margin:4px 0 14px}
.fig .row{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:nowrap;max-width:100%}
.fig .lab{font-size:20px;font-weight:800;min-width:36px;text-align:center;flex:0 0 auto}
.fig svg{display:block;max-width:100%;height:auto;flex:0 1 auto}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fffaf4;border:3px solid var(--line);border-radius:16px;padding:10px 12px;min-height:58px;font-size:20px;font-weight:600}
.opt .L{flex:0 0 38px;height:38px;border-radius:50%;background:#ffe2c7;color:#b4501f;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px}
.opt .T{flex:1 1 auto;min-width:0;word-wrap:break-word}
.opt.sel{border-color:var(--sel);background:var(--selbg)}
.opt.sel .L{background:var(--sel);color:#fff}
.nav{display:flex;gap:10px;margin-top:14px}
.nav button{flex:1;border:none;border-radius:14px;padding:13px 8px;font-size:18px;font-weight:800;background:#ffe2c7;color:#b4501f}
.nav button[disabled]{opacity:.4}
.dots{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:14px 0 4px}
.dot{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);background:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center}
.dot.done{background:#ffe2c7;border-color:var(--main2)}
.dot.cur{border-color:var(--sel);box-shadow:0 0 0 3px var(--selbg)}
.hint{text-align:center;color:var(--muted);font-size:15px;margin-top:8px;min-height:20px}
/* fractions */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.08;margin:0 .12em;font-weight:800;white-space:nowrap}
.fr>span{display:block;padding:0 .18em;text-align:center}
.fr>span:first-child{border-bottom:.1em solid currentColor;padding-bottom:.06em}
.fr>span:last-child{padding-top:.06em}
.bx{display:inline-block;width:.85em;height:.95em;border:.1em solid currentColor;border-radius:.12em;vertical-align:middle}
.nw{white-space:nowrap}
.big{font-size:1.35em}
sup{font-size:.62em;line-height:0;vertical-align:.75em;font-weight:800}
.grid-note{font-size:15px;color:var(--muted);text-align:center}
/* result */
.res-head{text-align:center}
.score{font-size:54px;font-weight:900;color:#c4471b;line-height:1.1;white-space:nowrap}
.score small{font-size:24px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:#fff8ef;border-radius:12px;padding:8px 4px;text-align:center}
.stat b{display:block;font-size:22px;white-space:nowrap}
.stat span{font-size:13px;color:var(--muted)}
.who{font-size:20px;font-weight:800;word-wrap:break-word}
.tpc{color:var(--muted);font-size:15px;margin-top:2px}
.msg{margin-top:10px;font-size:18px;font-weight:700}
.rv{border-radius:14px;padding:12px;margin-bottom:10px;border:2px solid}
.rv.ok{background:var(--okbg);border-color:#9fd8b5}
.rv.no{background:var(--badbg);border-color:#f2b0ac}
.rv .h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.rv .n{font-weight:900;font-size:17px}
.rv .q{font-size:16px;font-weight:600;margin-bottom:6px;line-height:1.5}
.rv .a{font-size:16px;line-height:1.6}
.rv .e{font-size:15px;margin-top:6px;background:rgba(255,255,255,.7);border-radius:10px;padding:7px 9px;line-height:1.55}
.rv .s{font-size:15px;margin-top:6px;color:#a3362f;font-weight:700}
.mark{font-weight:900;font-size:15px;white-space:nowrap}
.ok .mark{color:var(--ok)} .no .mark{color:var(--bad)}
.date{text-align:center;color:var(--muted);font-size:13px;margin-top:6px}
@media (max-width:360px){
  body{font-size:17px}
  .qtext{font-size:19px}
  .opt{font-size:18px;padding:9px 10px}
  h1{font-size:22px}
  .dot{width:34px;height:34px;font-size:15px}
}
</style>
</head>
<body>
<div id="app">

<section id="start">
  <div class="card hero">
    <div class="emoji">🧮</div>
    <div class="sub">Математика · 3-сынып · 2-тоқсан</div>
    <h1 id="sTitle"></h1>
  </div>
  <div class="card">
    <h2>🎯 Оқу мақсаттары</h2>
    <ul class="goals" id="sGoals"></ul>
    <div class="levels">
      <span class="badge bA">1–6: А деңгейі</span>
      <span class="badge bB">7–8: В деңгейі</span>
      <span class="badge bC">9–10: С деңгейі</span>
    </div>
  </div>
  <div class="card">
    <label class="lbl" for="name">✏️ Оқушының аты</label>
    <input type="text" id="name" autocomplete="off" maxlength="40" placeholder="Атыңды жаз">
    <div class="err" id="nameErr"></div>
    <button class="btn" id="startBtn">Бастау ▶</button>
  </div>
</section>

<section id="quiz" class="hidden">
  <div class="topbar">
    <span id="lvl" class="badge"></span>
    <span class="counter" id="cnt">1/10</span>
  </div>
  <div class="pbar"><i id="pb"></i></div>
  <div class="card qcard" id="qcard">
    <div class="qtext" id="qtext"></div>
    <div class="fig" id="qfig"></div>
    <div class="opts" id="opts"></div>
  </div>
  <div class="nav">
    <button id="prev">◀ Алдыңғы</button>
    <button id="next">Келесі ▶</button>
  </div>
  <div class="dots" id="dots"></div>
  <div class="hint" id="hint"></div>
  <div style="margin-top:10px"><button class="btn green" id="finish">Аяқтау ✔</button></div>
</section>

<section id="result" class="hidden">
  <div class="card res-head">
    <div class="who" id="rName"></div>
    <div class="tpc" id="rTopic"></div>
    <div class="score" id="rScore"></div>
    <div class="stats">
      <div class="stat"><b id="rBall"></b><span>балл</span></div>
      <div class="stat"><b id="rRight"></b><span>дұрыс жауап</span></div>
      <div class="stat"><b id="rPct"></b><span>пайыз</span></div>
    </div>
    <div class="msg" id="rMsg"></div>
    <div class="date" id="rDate"></div>
  </div>
  <div class="card">
    <h2>📋 Жауаптарды тексерейік</h2>
    <div id="rList"></div>
  </div>
  <button class="btn" id="again">🔄 Қайта орындау</button>
</section>

</div>
<script>
"use strict";
/* ---------- көмекші функциялар ---------- */
function F(a,b){return '<span class="fr"><span>'+a+'</span><span>'+b+'</span></span>';}
var BX='<span class="bx"></span>';
function N(s){return '<span class="nw">'+s+'</span>';}
var PAPER='#fff7ec', STROKE='#7a4b2a';
function pie(n,k,color,size){
  size=size||140; var c=size/2, r=size/2-6, s='<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'">';
  for(var i=0;i<n;i++){
    var a0=-Math.PI/2+2*Math.PI*i/n, a1=-Math.PI/2+2*Math.PI*(i+1)/n;
    var x0=c+r*Math.cos(a0), y0=c+r*Math.sin(a0), x1=c+r*Math.cos(a1), y1=c+r*Math.sin(a1);
    var fill=(i<k)?(color||'#ff8a5b'):PAPER;
    s+='<path d="M'+c+','+c+' L'+x0.toFixed(2)+','+y0.toFixed(2)+' A'+r+','+r+' 0 '+((a1-a0)>Math.PI?1:0)+' 1 '+x1.toFixed(2)+','+y1.toFixed(2)+' Z" fill="'+fill+'" stroke="'+STROKE+'" stroke-width="2.5" stroke-linejoin="round"/>';
  }
  return s+'</svg>';
}
/* k — боялған бөлік саны немесе түстер массиві; o.label — бірінші бөліктің астындағы жазу */
function bar(n,k,o){
  o=o||{}; var W=o.w||280, H=o.h||46, cw=W/n, extra=o.label?30:0;
  var s='<svg viewBox="0 0 '+(W+6)+' '+(H+6+extra)+'" width="'+(W+6)+'" height="'+(H+6+extra)+'">';
  for(var i=0;i<n;i++){
    var fill=PAPER;
    if(Array.isArray(k)){ if(k[i]) fill=k[i]; } else if(i<k){ fill=o.color||'#ff8a5b'; }
    s+='<rect x="'+(3+i*cw).toFixed(2)+'" y="3" width="'+cw.toFixed(2)+'" height="'+H+'" fill="'+fill+'" stroke="'+STROKE+'" stroke-width="2.5"/>';
  }
  if(o.label){
    var y=H+12, x0=3+4, x1=3+cw-4;
    s+='<path d="M'+x0+','+(y-4)+' L'+x0+','+y+' L'+x1+','+y+' L'+x1+','+(y-4)+'" fill="none" stroke="#c4471b" stroke-width="2.5"/>';
    s+='<text x="'+(3+cw/2)+'" y="'+(y+18)+'" text-anchor="middle" font-size="18" font-weight="800" fill="#c4471b" font-family="Arial,sans-serif">'+o.label+'</text>';
  }
  return s+'</svg>';
}
function row(lab,svg){return '<div class="row">'+(lab?'<span class="lab">'+lab+'</span>':'')+svg+'</div>';}

/* ---------- ойын деректері ---------- */
var TOPIC='Фигуралар салу';
var GOALS=[
 ['3.3.1.5','Берілген ауданы бойынша торкөзді қағазға жазық фигуралар салу, олардың пішіндері өзгеруіне қарай ауданының қалай өзгеретінін түсіндіру.'],
 ['3.3.2.1','Нүктелі қағазда параллель және қиылысатын түзулерді/ қиылысатын геометриялық жазық фигураларды сызу, олардың қиылысу және бірігу аймағын табу.'],
 ['3.5.2.3','Бұрыштарды, көпбұрыштарды латын алфавитінің бас әріптерімен таңбалау, оларды таңбалануы бойынша оқу.']];
var TX='font-family="Arial,sans-serif" font-weight="800" font-size="17" fill="#3b2a1a"';
/* торкөзді қағаз: cols × rows торкөз, бір торкөз = 1 см. shapes: {pts:[[x,y],...] (y төменнен жоғары), fill, op} */
function grid(cols,rows,shapes,c){
  c=c||28; var m=10, W=cols*c+2*m, H=rows*c+2*m+22, i;
  function P(p){return (m+p[0]*c)+','+(m+(rows-p[1])*c);}
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" '+TX+'>';
  s+='<rect x="'+m+'" y="'+m+'" width="'+cols*c+'" height="'+rows*c+'" fill="#fffdf8"/>';
  for(i=0;i<=cols;i++) s+='<line x1="'+(m+i*c)+'" y1="'+m+'" x2="'+(m+i*c)+'" y2="'+(m+rows*c)+'" stroke="#bcd3f0" stroke-width="1.2"/>';
  for(i=0;i<=rows;i++) s+='<line x1="'+m+'" y1="'+(m+i*c)+'" x2="'+(m+cols*c)+'" y2="'+(m+i*c)+'" stroke="#bcd3f0" stroke-width="1.2"/>';
  shapes.forEach(function(sh){
    s+='<polygon points="'+sh.pts.map(P).join(' ')+'" fill="'+sh.fill+'" fill-opacity="'+(sh.op||1)+'" stroke="'+(sh.stroke||'#7a4b2a')+'" stroke-width="3" stroke-linejoin="round"/>';
  });
  s+='<text x="'+m+'" y="'+(m+rows*c+20)+'" font-size="14" fill="#7a6552">1 торкөз = 1 см</text>';
  return s+'</svg>';
}
function R(x,y,w,h){return [[x,y],[x+w,y],[x+w,y+h],[x,y+h]];}
function lines(par){
  var s='<svg viewBox="0 0 260 150" width="260" height="150">';
  if(par){
    s+='<line x1="15" y1="40" x2="245" y2="40" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>';
    s+='<line x1="15" y1="110" x2="245" y2="110" stroke="#e5484d" stroke-width="4" stroke-linecap="round"/>';
  } else {
    s+='<line x1="20" y1="25" x2="240" y2="125" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>';
    s+='<line x1="20" y1="125" x2="240" y2="25" stroke="#e5484d" stroke-width="4" stroke-linecap="round"/>';
    s+='<circle cx="130" cy="75" r="6" fill="#3b2a1a"/>';
  }
  return s+'</svg>';
}
function quad(){
  var s='<svg viewBox="0 0 260 170" width="260" height="170" '+TX+' font-size="20">';
  s+='<polygon points="40,135 70,30 210,40 230,140" fill="#ffd08a" stroke="#7a4b2a" stroke-width="3" stroke-linejoin="round"/>';
  [[40,135,'A',-24,18],[70,30,'B',-22,-4],[210,40,'C',8,-6],[230,140,'D',8,18]].forEach(function(p){
    s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="5" fill="#3b2a1a"/><text x="'+(p[0]+p[3])+'" y="'+(p[1]+p[4])+'">'+p[2]+'</text>';
  });
  return s+'</svg>';
}
var Q=[
{q:'Қабырғасы 1 см торкөзді қағазға ұзындығы 4 торкөз, ені 3 торкөз тіктөртбұрыш салынды. Ауданы қанша?',
 fig:row('',grid(6,4,[{pts:R(1,0,4,3),fill:'#ffd08a',op:.85}])),
 o:[N('12 см²'),N('7 см²'),N('10 см²'),N('14 см²')],a:0,
 e:N('4 · 3 = 12 см²')+'.'},
{q:'Қабырғасы 1 см торкөзді қағазға қабырғасы 5 торкөз шаршы салынды. Ауданы қанша?',
 fig:row('',grid(7,5,[{pts:R(1,0,5,5),fill:'#c9ecb4',op:.85}],26)),
 o:[N('25 см²'),N('30 см²'),N('10 см²'),N('20 см²')],a:0,
 e:N('5 · 5 = 25 см²')+'.'},
{q:'Көпбұрыштың төбелерін белгілеуге қай таңбалар қолданылады?',
 o:['Тек амал таңбалары','Тек бөлшектер','Тек кіші сандар','Латынның бас әріптері'],a:3,
 e:'Геометриялық фигураның төбелері A, B, C сияқты латынның бас әріптерімен белгіленеді.'},
{q:'Бір жазықтықта жатқан, қанша созса да қиылыспайтын екі түзу қалай аталады?',
 fig:row('',lines(true)),
 o:['Қиылысатын түзулер','Параллель түзулер','Диаметрлер','Радиустар'],a:1,
 e:'Бір жазықтықтағы параллель түзулер қиылыспайды.'},
{q:'Екі түзу бір нүктеде кездеседі. Олар қандай түзулер?',
 fig:row('',lines(false)),
 o:['Тең бөліктер','Қиылысатын','Тұйық','Параллель'],a:1,
 e:'Ортақ нүктесі бар екі әртүрлі түзу қиылысады.'},
{q:'Төбелері ретімен A, B, C, D деп белгіленген төртбұрыштың атауын таңда.',
 fig:row('',quad()),
 o:['ABCD төртбұрышы','O центрі','AB кесіндісі','ABC үшбұрышы'],a:0,
 e:'Төрт төбе ретімен аталады: ABCD.'},
{q:'Ауданы 18 см² тіктөртбұрышты торкөзді қағазға салу керек. Ұзындығы 6 см болса, ені неше сантиметр?',
 o:[N('12 см'),N('2 см'),N('4 см'),N('3 см')],a:3,
 e:'Ені = аудан : ұзындық: '+N('18 : 6 = 3 см')+'.'},
{q:'Ауданы 12 см² тіктөртбұрыштың өлшемдері 6 см және 2 см еді. Ауданын өзгертпей, ұзындығын 4 см етіп қайта салды. Ені қанша болуы керек?',
 o:[N('6 см'),N('3 см'),N('4 см'),N('2 см')],a:1,
 e:'Аудан сол қалпы — 12 см². '+N('12 : 4 = 3 см')+'.'},
{q:'Екі тіктөртбұрыштың аудандары 12 см² және 10 см². Ортақ бөлігінің ауданы 4 см². Олардың бірігу аймағының ауданын тап.',
 fig:row('',grid(8,4,[{pts:R(0,0,4,3),fill:'#ffb347',op:.6},{pts:R(2,1,5,2),fill:'#3b82f6',op:.45,stroke:'#1e4fb8'}],28)),
 o:[N('26 см²'),N('22 см²'),N('18 см²'),N('14 см²')],a:2,
 e:'Ортақ бөлік екі рет саналмауы керек: '+N('12 + 10 − 4 = 18 см²')+'.'},
{q:'Қабырғасы 1 см торкөзде 5 × 4 тіктөртбұрыш салынды. Бір бұрышынан 2 × 2 шаршы алынды. Қалған фигураның ауданын тап.',
 fig:row('',grid(7,5,[{pts:[[1,0],[6,0],[6,2],[4,2],[4,4],[1,4]],fill:'#ffd08a',op:.9},{pts:R(4,2,2,2),fill:'#ffffff',op:.2,stroke:'#e5484d'}],26)),
 o:[N('20 см²'),N('12 см²'),N('16 см²'),N('24 см²')],a:2,
 e:N('5 · 4 − 2 · 2 = 20 − 4 = 16 см²')+'.'}
];


/* ---------- ойын қозғалтқышы ---------- */
var LV={A:{t:'А деңгейі',c:'bA',q:'lA'},B:{t:'В деңгейі',c:'bB',q:'lB'},C:{t:'С деңгейі',c:'bC',q:'lC'}};
function lvlOf(i){return i<6?'A':(i<8?'B':'C');}
var LET=['A','B','C','D'];
var SUPPORT=['Ештеңе етпейді, келесі жолы міндетті түрде шығарасың! 💪','Түсіндірмені оқып көр — енді түсінікті болады 🌟','Жақсы талпындың! Дұрыс жауапты есте сақта 🙂','Қателік — үйренудің бір қадамы 👍'];
var st={name:'',ans:[],i:0};
function $(id){return document.getElementById(id);}
function show(id){['start','quiz','result'].forEach(function(s){$(s).classList.toggle('hidden',s!==id);});window.scrollTo(0,0);}

document.title=TOPIC;
$('sTitle').textContent=TOPIC;
$('sGoals').innerHTML=GOALS.map(function(g){return '<li><b>'+g[0]+'</b> — '+g[1]+'</li>';}).join('');

function startQuiz(){
  var nm=$('name').value.trim();
  if(!nm){$('nameErr').textContent='Алдымен атыңды жаз 🙂';$('name').focus();return;}
  $('nameErr').textContent='';
  st.name=nm; st.ans=[]; for(var i=0;i<Q.length;i++) st.ans.push(null); st.i=0;
  show('quiz'); render();
}
$('startBtn').onclick=startQuiz;
$('name').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();startQuiz();}});

function render(){
  var i=st.i, q=Q[i], L=LV[lvlOf(i)];
  $('lvl').className='badge '+L.c; $('lvl').textContent=L.t;
  $('cnt').textContent=(i+1)+'/'+Q.length;
  $('qcard').className='card qcard '+L.q;
  $('qtext').innerHTML=(i+1)+'. '+q.q;
  var fig=q.fig||''; $('qfig').innerHTML=fig; $('qfig').classList.toggle('hidden',!fig);
  $('opts').innerHTML=q.o.map(function(t,j){
    return '<button class="opt'+(st.ans[i]===j?' sel':'')+'" data-j="'+j+'"><span class="L">'+LET[j]+'</span><span class="T">'+t+'</span></button>';
  }).join('');
  Array.prototype.forEach.call($('opts').querySelectorAll('.opt'),function(b){
    b.onclick=function(){st.ans[st.i]=+b.getAttribute('data-j');render();};
  });
  $('prev').disabled=(i===0);
  $('next').disabled=(i===Q.length-1);
  var done=st.ans.filter(function(a){return a!==null;}).length;
  $('pb').style.width=(done*100/Q.length)+'%';
  $('dots').innerHTML=Q.map(function(_,j){
    return '<button class="dot'+(st.ans[j]!==null?' done':'')+(j===i?' cur':'')+'" data-j="'+j+'">'+(j+1)+'</button>';
  }).join('');
  Array.prototype.forEach.call($('dots').querySelectorAll('.dot'),function(b){
    b.onclick=function(){st.i=+b.getAttribute('data-j');render();window.scrollTo(0,0);};
  });
  var miss=[]; st.ans.forEach(function(a,j){if(a===null)miss.push(j+1);});
  $('finish').disabled=miss.length>0;
  $('hint').textContent=miss.length?('Жауап берілмеген сұрақтар: '+miss.join(', ')):'Барлық сұраққа жауап бердің! «Аяқтау» батырмасын бас 🎉';
}
$('prev').onclick=function(){if(st.i>0){st.i--;render();window.scrollTo(0,0);}};
$('next').onclick=function(){if(st.i<Q.length-1){st.i++;render();window.scrollTo(0,0);}};

$('finish').onclick=function(){
  if(st.ans.some(function(a){return a===null;})) return;
  var right=0;
  st.ans.forEach(function(a,j){if(a===Q[j].a) right++;});
  var total=Q.length, pct=Math.round(right*100/total);
  $('rName').textContent='👤 '+st.name;
  $('rTopic').textContent=TOPIC;
  $('rScore').innerHTML=right+'<small> / '+total+' балл</small>';
  $('rBall').textContent=right; $('rRight').textContent=right+'/'+total; $('rPct').textContent=pct+'%';
  var m;
  if(right===total) m='🏆 Керемет! Барлық сұраққа дұрыс жауап бердің!';
  else if(right>=8) m='🌟 Өте жақсы! Сен тақырыпты жақсы меңгергенсің!';
  else if(right>=5) m='💪 Жақсы! Қателерді қарап шық — келесі жолы одан да жақсы болады!';
  else m='🙂 Талпынғаның үшін жарайсың! Түсіндірмелерді оқып, қайта орындап көр.';
  $('rMsg').textContent=m;
  var d=new Date(); function p(x){return (x<10?'0':'')+x;}
  $('rDate').textContent=p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear()+'  '+p(d.getHours())+':'+p(d.getMinutes());
  var sc=0;
  $('rList').innerHTML=Q.map(function(q,j){
    var ok=st.ans[j]===q.a, L=LV[lvlOf(j)];
    var h='<div class="rv '+(ok?'ok':'no')+'"><div class="h"><span class="n">'+(j+1)+'-сұрақ <span class="badge '+L.c+'" style="font-size:12px;padding:3px 8px">'+L.t+'</span></span><span class="mark">'+(ok?'✔ Дұрыс · 1 балл':'✘ Қате · 0 балл')+'</span></div>';
    h+='<div class="q">'+q.q+'</div>';
    h+='<div class="a">Сенің жауабың: <b>'+LET[st.ans[j]]+')</b> '+q.o[st.ans[j]]+'</div>';
    if(!ok) h+='<div class="a">Дұрыс жауап: <b>'+LET[q.a]+')</b> '+q.o[q.a]+'</div>';
    h+='<div class="e">💡 '+q.e+'</div>';
    if(!ok){h+='<div class="s">'+SUPPORT[sc%SUPPORT.length]+'</div>';sc++;}
    return h+'</div>';
  }).join('');
  show('result');
};
$('again').onclick=function(){
  st.ans=[]; st.i=0;
  show('start');
};
</script>
</body>
</html>
